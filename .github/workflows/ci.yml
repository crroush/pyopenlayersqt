name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Static syntax checks
        run: python -m compileall -q pyopenlayersqt

      - name: Static import checks
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import pyopenlayersqt

          for module in pkgutil.walk_packages(pyopenlayersqt.__path__, pyopenlayersqt.__name__ + "."):
              importlib.import_module(module.name)
          PY

      - name: Build package
        run: python -m build

      - name: Run tests
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        run: |
          python -m pip install pytest
          python -m pytest
