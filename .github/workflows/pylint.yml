name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxcb-cursor0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install "pylint>=3.3,<4"
    - name: Import package modules
      run: |
        python - <<'PY'
        import importlib
        import pkgutil
        import pyopenlayersqt

        failures = []
        for module_info in pkgutil.walk_packages(
            pyopenlayersqt.__path__, pyopenlayersqt.__name__ + "."
        ):
            try:
                importlib.import_module(module_info.name)
            except Exception as exc:  # noqa: BLE001 - report every import failure
                failures.append(f"{module_info.name}: {exc!r}")

        if failures:
            print("Module import failures:")
            print("\n".join(failures))
            raise SystemExit(1)
        PY
    - name: Analysing the code with pylint
      run: |
        pylint --rcfile=.pylintrc $(git ls-files '*.py')
