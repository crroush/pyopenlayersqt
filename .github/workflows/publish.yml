name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-supported-python:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libnss3 \
            libopengl0 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libxrender1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Static syntax checks
        run: python -m compileall -q pyopenlayersqt

      - name: Static import checks
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import pyopenlayersqt

          for module in pkgutil.walk_packages(pyopenlayersqt.__path__, pyopenlayersqt.__name__ + "."):
              importlib.import_module(module.name)
          PY

      - name: Build package
        run: python -m build

      - name: Run tests
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        run: |
          python -m pip install pytest
          python -m pytest

  build:
    name: Build distribution
    needs:
      - validate-supported-python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/pyopenlayersqt-smoke
          /tmp/pyopenlayersqt-smoke/bin/python -m pip install --upgrade pip
          /tmp/pyopenlayersqt-smoke/bin/python -m pip install dist/*.whl
          /tmp/pyopenlayersqt-smoke/bin/python - <<'PY'
          import pyopenlayersqt
          print(pyopenlayersqt.__name__)
          PY

      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyopenlayersqt
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # For token-based authentication (if trusted publishing is not available):
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
